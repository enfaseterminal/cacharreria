<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Post Generator</title>
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --bg: #f4f7f6;
            --text: #333;
            --white: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--white);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: var(--primary); margin-bottom: 10px; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input[type="url"] {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        select {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        .options-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 25px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            align-items: center;
        }
        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        input[type="url"]:focus { border-color: var(--primary); }
        button {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }
        button:hover { background: var(--secondary); transform: translateY(-2px); }
        button:active { transform: translateY(0); }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) { .results-grid { grid-template-columns: 1fr; } }

        .card {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            background: #fafafa;
            position: relative;
        }
        .card h3 {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            resize: none;
            font-family: inherit;
            font-size: 0.95rem;
            margin-bottom: 10px;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .char-count { font-size: 0.8rem; color: #666; }
        .char-count.limit { color: #e74c3c; font-weight: bold; }
        .copy-btn {
            padding: 5px 12px;
            font-size: 0.8rem;
            background: #444;
        }
        .status-msg {
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            min-height: 24px;
        }
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.7);
            overflow-y: auto;
        }
        .modal-content {
            background-color: #f0f2f5;
            margin: 5% auto;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 550px;
            position: relative;
        }
        .close-modal {
            position: absolute;
            right: 20px;
            top: 10px;
            font-size: 28px;
            cursor: pointer;
            color: #666;
        }

        /* Mockup Styles */
        .feed-mockup {
            background: white;
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .mockup-header { display: flex; gap: 10px; margin-bottom: 10px; }
        .mockup-avatar { width: 40px; height: 40px; background: #ddd; border-radius: 50%; }
        .mockup-user-info { display: flex; flex-direction: column; justify-content: center; }
        .mockup-name { font-weight: bold; font-size: 15px; }
        .mockup-handle { color: #65676b; font-size: 13px; }
        .mockup-text { font-size: 15px; margin-bottom: 12px; white-space: pre-wrap; color: #1c1e21; }
        .mockup-image { width: 100%; border-radius: 8px; border: 1px solid #ddd; display: block; }
        .mockup-footer { margin-top: 12px; padding-top: 10px; border-top: 1px solid #eee; display: flex; justify-content: space-around; color: #65676b; font-size: 13px; }

        #preview-canvas-container {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            background: #eee;
            border-radius: 10px;
            display: none;
        }
        canvas {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }
        .download-img-btn {
            background: #27ae60;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .download-img-btn:hover {
            background: #219150;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Social Poster Hub</h1>
        <p>Introduce una URL para generar publicaciones optimizadas</p>
    </header>

    <div class="input-group">
        <input type="url" id="target-url" placeholder="https://ejemplo.com/articulo" required>
        <button onclick="pasteUrl()" style="background: #6c757d;" id="paste-url-btn" title="Pegar URL desde el portapapeles">📋</button>
        <select id="tone-select">
            <option value="formal" data-lang-key="formalTone">👔 Formal</option>
            <option value="divertido" data-lang-key="funTone">✨ Divertido</option>
            <option value="clickbait" data-lang-key="clickbaitTone">🔥 Clickbait</option>
        </select>
        <select id="language-select" onchange="updateUIWithLanguage()">
            <option value="es">🇪🇸 Español</option>
            <option value="en">🇬🇧 English</option>
        </select>
        <button onclick="processUrl()">Generar</button>
    </div>

    <div class="options-row">
        <div class="option-item">
            <input type="checkbox" id="use-hashtags" checked>
            <label for="use-hashtags" data-lang-key="useHashtags">Incluir Hashtags</label>
        </div>
        <div class="option-item">
            <label for="image-format" data-lang-key="imageFormat">Formato de Imagen:</label>
            <select id="image-format">
                <option value="x" data-lang-key="xTwitter">X / Twitter (16:9)</option>
                <option value="linkedin">LinkedIn (1.91:1)</option>
                <option value="facebook">Facebook (1.91:1)</option>
                <option value="instagram">Instagram (1:1)</option>
            </select>
        </div>
    </div>

    <div id="loader" class="loader"></div>
    <div id="status" class="status-msg"></div>

    <!-- Nueva sección para la imagen de previsualización -->
    <div id="preview-canvas-container">
        <canvas id="social-canvas" width="1200" height="630"></canvas>
        <button class="download-img-btn" onclick="downloadImage()" data-lang-key="downloadImage">💾 Descargar Imagen de Previsualización</button>
    </div>

    <!-- Modal de Vista Previa -->
    <div id="preview-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closePreview()">&times;</span>
            <div id="mockup-container"></div>
        </div>
    </div>

    <div class="results-grid">
        <!-- X / Twitter -->
        <div class="card">
            <h3>𝕏 (Twitter)</h3>
            <textarea id="text-x" oninput="updateCount('x')"></textarea>
            <div class="card-footer">
                <span id="count-x" class="char-count">0 / 280</span>
                <button class="copy-btn" style="background: #222;" onclick="showFeedPreview('x')" data-lang-key="view">👁️ Ver</button>
                <button class="copy-btn" style="background: #1da1f2;" onclick="publishText('x')">🚀 Publicar</button>
                <button class="copy-btn" onclick="copyText('text-x')">Copiar</button>
            </div>
        </div>

        <!-- LinkedIn -->
        <div class="card">
            <h3>LinkedIn</h3>
            <textarea id="text-linkedin" oninput="updateCount('linkedin')"></textarea>
            <div class="card-footer">
                <span id="count-linkedin" class="char-count">0 / 3000</span>
                <button class="copy-btn" style="background: #0077b5;" onclick="showFeedPreview('linkedin')" data-lang-key="view">👁️ Ver</button>
                <button class="copy-btn" style="background: #004182;" onclick="publishText('linkedin')">🚀 Publicar</button>
                <button class="copy-btn" onclick="copyText('text-linkedin')">Copiar</button>
            </div>
        </div>

        <!-- Facebook -->
        <div class="card">
            <h3>Facebook</h3>
            <textarea id="text-facebook" oninput="updateCount('facebook')"></textarea>
            <div class="card-footer">
                <span id="count-facebook" class="char-count">0</span>
                <button class="copy-btn" style="background: #1877f2;" onclick="showFeedPreview('facebook')" data-lang-key="view">👁️ Ver</button>
                <button class="copy-btn" style="background: #3b5998;" onclick="publishText('facebook')">🚀 Publicar</button>
                <button class="copy-btn" onclick="copyText('text-facebook')">Copiar</button>
            </div>
        </div>

        <!-- Threads -->
        <div class="card">
            <h3>Threads</h3>
            <textarea id="text-threads" oninput="updateCount('threads')"></textarea>
            <div class="card-footer">
                <span id="count-threads" class="char-count">0 / 500</span>
                <button class="copy-btn" style="background: #000;" onclick="showFeedPreview('threads')" data-lang-key="view">👁️ Ver</button>
                <button class="copy-btn" style="background: #444;" onclick="publishText('threads')">🚀 Publicar</button>
                <button class="copy-btn" onclick="copyText('text-threads')">Copiar</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
