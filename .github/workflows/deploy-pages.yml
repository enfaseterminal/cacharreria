name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: diagrama-flujo/package-lock.json

      - name: Install dependencies
        working-directory: diagrama-flujo
        run: npm ci

      - name: Run tests
        working-directory: diagrama-flujo
        run: npm test

      - name: Build application
        working-directory: diagrama-flujo
        run: npm run build

      - name: Assemble Pages site
        run: |
          mkdir -p _site
          git archive --format=tar HEAD -- . ':(exclude)diagrama-flujo' | tar -xf - -C _site
          mkdir -p _site/diagrama-flujo
          cp -a diagrama-flujo/dist/. _site/diagrama-flujo/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
